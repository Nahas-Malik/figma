<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Schedule</title>
    <style>
        table, th, td { 
            border: 2px solid black; 
            border-collapse: collapse; 
        }
        th, td {
            text-align: center;
            padding: 8px;
        }
    </style>
</head>
<body>

    <table width="100%">
        <caption><b>Daily Schedule</b></caption>
        <tr>
            <th rowspan="2" width="15%"><b>Task</b></th>
            <th colspan="7"><b>Day of the Week</b></th>
        </tr>
        <tr>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
            <th>Sun</th>
        </tr>
        <tr>
            <td>College</td>
            <td>Java</td>
            <td>Web<br>Design</td>
            <td>C lang</td>
            <td>Python</td>
            <td>Practical</td>
            <td colspan="2" rowspan="2">OF<br>F</td>
        </tr>
        <tr>
            <td>Work</td>
            <td colspan="5">Subject preparation and project work</td>
        </tr>
    </table>

</body>
</html>
