<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image 1 Layout</title>
    <style>
        table, th, td { 
            border: 2px solid black; 
            border-collapse: collapse; 
        }
        td {
            text-align: center;
            padding: 10px;
            height: 30px;
        }
    </style>
</head>
<body>

    <table width="80%">
        <tr>
            <td rowspan="1" width="25%">A</td>
            <td colspan="1" width="25%">B</td>
            <td rowspan="1" width="25%">C</td>
        </tr>
        <tr>
            <td colspan="1">D </td>
            <td rowspan="1">o</td>
        </tr>
        
    </table>

</body>
</html>
